name: CI com Análise de Segurança Completa

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Análise de SAST com Snyk
  snyk_sast_scan:
    name: Snyk SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instala e configura o Snyk
        uses: snyk/actions/setup@master

      - name: Roda o Snyk Code (SAST)
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # JOB 2: Análise de SCA (dependências) com Trivy
  trivy_sca_scan:
    name: Trivy SCA Scan
    runs-on: ubuntu-latest
    needs: snyk_sast_scan # roda depois do Snyk
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Cria diretório temporário para análise
      - name: Prepara diretório limpo para o Trivy
        run: |
          mkdir trivy_scan
          cp -r package*.json trivy_scan/ || true
          cd trivy_scan && npm install --package-lock-only

      # Roda o Trivy em diretório isolado
      - name: Roda o Trivy para procurar vulnerabilidades em dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./trivy_scan"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "library"

      # Ignora caches e relatórios anteriores
      - name: Limpa caches de scanners
        run: rm -rf .trivy .snyk snyk-code-client || true
